services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: forever
      POSTGRES_DB: forever
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: forever
      POSTGRES_DB: forever_test
    ports:
      - "5434:5432"
    # Throwaway data in RAM, durability off: tests are fast and always start clean.
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
